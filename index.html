<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3B8C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="카컨 수리관리">
<title>카컨 수리관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --brand:#0B3B8C; --brand-d:#082a63; --ink:#111827; --muted:#4B5563; --line:#E5E7EB; --bg:#F3F4F6; --card:#FFFFFF;
  --warn-bg:#FFEDD5; --warn:#9A3412; --bad-bg:#FEE2E2; --bad:#B91C1C; --ok-bg:#D1FAE5; --ok:#065F46; --info-bg:#DBEAFE; --info:#1E40AF;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
a{color:var(--brand)}
.top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-weight:900;font-size:18px;margin-right:auto;color:var(--brand)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{height:40px;padding:0 12px;border:none;background:transparent;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer}
.nav button.on{background:var(--bg);color:var(--ink)}
.who{font-size:13px;color:var(--muted)}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h2{margin:0 0 12px;font-size:16px;font-weight:800}
.h1{font-size:24px;font-weight:900;margin:4px 0}
.sub{font-size:14px;color:var(--muted)}
.btn{height:48px;padding:0 18px;border-radius:12px;border:1px solid #D1D5DB;background:var(--card);font-weight:700;cursor:pointer}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.big{width:100%;height:64px;font-size:18px;font-weight:900;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.orange{background:#C2410C;border-color:#C2410C;color:#fff}
.btn.green{background:#047857;border-color:#047857;color:#fff}
.btn.sm{height:40px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.oc{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;width:100%}
.oc.alert{border-color:#FDBA74;background:#FFFBF5}
.plate{font-size:20px;font-weight:900}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:999px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-warn{background:var(--warn-bg);color:var(--warn)} .b-bad{background:var(--bad-bg);color:var(--bad)}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-info{background:var(--info-bg);color:var(--info)} .b-done{background:var(--bg);color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;text-align:left}
.kpi b{display:block;font-size:30px;font-weight:900}
.kpi span{font-size:13px;font-weight:700;color:var(--muted)}
.kpi.on{outline:2px solid var(--brand)}
.kpi.w b{color:var(--warn)} .kpi.g b{color:var(--ok)}
.steps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px}
.step span{width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;background:var(--bg);color:#6B7280}
.step small{font-size:12px;color:#6B7280}
.step.done span{background:var(--brand);color:#fff} .step.done small{color:var(--ink);font-weight:700}
.step.next span{background:#fff;color:var(--brand);border:2px solid var(--brand)} .step.next small{color:var(--ink);font-weight:700}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;word-break:break-all}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#CBD5E1;border:none;padding:0;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph em{position:absolute;left:6px;top:6px;font-style:normal;font-size:11px;font-weight:700;background:#fff;padding:2px 6px;border-radius:6px}
.ph small{position:absolute;left:6px;bottom:6px;font-size:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.tl li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--bg);padding-bottom:8px}
.memo{border-bottom:1px solid var(--bg);padding:8px 0;font-size:15px;white-space:pre-wrap}
.memo small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
label.f input,label.f select,label.f textarea,.in{height:48px;border:1px solid #D1D5DB;border-radius:10px;padding:0 12px;background:#fff;font-weight:500;width:100%}
label.f textarea,textarea.in{height:auto;min-height:90px;padding:10px 12px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;min-height:44px}
.chk input{width:22px;height:22px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:9}
.bottom .in2{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.back{width:44px;height:44px;border:none;background:transparent;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
.okcircle{width:88px;height:88px;border-radius:999px;background:var(--ok-bg);display:flex;align-items:center;justify-content:center}
.note{font-size:13px;color:#374151;background:var(--bg);padding:12px 14px;border-radius:12px;line-height:1.6}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-size:12px;padding:8px}
.tbl td{padding:8px;border-top:1px solid var(--bg);vertical-align:middle}
.tbl select,.tbl input[type=text]{height:40px;border:1px solid #D1D5DB;border-radius:8px;padding:0 8px;min-width:100px}
.scroll{overflow-x:auto}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;font-weight:600;z-index:50;display:none;max-width:90vw}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.75);display:none;align-items:center;justify-content:center;z-index:40;font-weight:800;font-size:17px}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.err{color:var(--bad);font-size:14px;font-weight:600;min-height:20px}
</style>
</head>
<body>
<div class="top" id="top" hidden></div>
<main class="wrap" id="app"></main>
<div id="toast" role="status"></div>
<div id="busy"><span id="busyMsg">처리 중…</span></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===================== 설정 =====================
const SUPABASE_URL = 'https://vgbrkddsuchmhzevfgkg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Os0roCD0xwSAdCOc2HcNuw_XmFDb4Je';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const STAGES = ['입고','분해','판금','도장','조립','세차','출고'];
const DELAY_REASONS = ['부품 대기','보험사 승인 대기','추가 손상 발견','고객 요청','기타'];
const ACCIDENT_TYPES = ['자차','대물','피해'];
const INSURERS = ['삼성화재','현대해상','DB손해보험','KB손해보험','메리츠화재','한화손해보험','롯데손해보험','흥국화재','MG손해보험','AXA손해보험','하나손해보험','캐롯손해보험'];
const SOURCES = ['네이버 플레이스','네이버 블로그','카카오 채널','전화','지인 소개','기타'];
const DOW = '일월화수목금토';

const S = { me:null, view:'list', id:null, filter:'all', q:'', orders:[], shops:[], pending:null, after:null, showReleased:false, editing:false, dueOpen:false };
const $app = document.getElementById('app');
const $top = document.getElementById('top');

// ===================== 공통 도구 =====================
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const isHQ = () => S.me && S.me.active && (S.me.role === 'admin' || S.me.role === 'staff');
const isAdmin = () => S.me && S.me.active && S.me.role === 'admin';
function parseDay(x){ return (typeof x === 'string' && x.length === 10) ? new Date(x + 'T00:00:00') : new Date(x); }
function fmtDay(x){ if(!x) return '-'; const d = parseDay(x); return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`; }
function fmtDT(x){ if(!x) return '-'; const d = new Date(x); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function ago(x){ const m = Math.floor((Date.now() - new Date(x)) / 60000); if(m < 1) return '방금'; if(m < 60) return m + '분 전'; const h = Math.floor(m/60); if(h < 24) return h + '시간 전'; return Math.floor(h/24) + '일 전'; }
function hoursSince(x){ return (Date.now() - new Date(x)) / 3600000; }
function todayStr(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function sod(x){ const d = parseDay(x); d.setHours(0,0,0,0); return d; }
function repairDays(o){ const s = o.intake_at || o.created_at; const e = o.released_at || new Date().toISOString(); return Math.max(0, Math.round((sod(e) - sod(s)) / 86400000)); }
function dueDiffLabel(o){
  if(!o.due_date || !o.released_at) return '';
  const n = Math.round((sod(o.released_at) - sod(o.due_date)) / 86400000);
  return n < 0 ? `예정보다 ${-n}일 빠름` : n === 0 ? '예정대로 출고' : `예정보다 ${n}일 지연`;
}
function toLocalInput(ts){ if(!ts) return ''; const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function normPhone(s){ const d = String(s||'').replace(/\D/g,''); if(d.length === 11) return d.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3'); if(d.length === 10) return d.replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3'); return String(s||'').trim(); }
const nextName = st => st >= 6 ? '' : STAGES[st + 1];
const stageLabel = st => st < 0 ? '입고 대기' : STAGES[st] + ' 완료';
const contactOf = o => Array.isArray(o.order_contacts) ? (o.order_contacts[0] || {}) : (o.order_contacts || {});

let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 3200); }
function busy(on, msg){ document.getElementById('busyMsg').textContent = msg || '처리 중…'; document.getElementById('busy').style.display = on ? 'flex' : 'none'; }
function fail(e){ busy(false); console.error(e); toast((e && (e.message || e.error_description)) || '오류가 발생했습니다'); }
function go(view, id){ S.view = view; S.id = id || null; S.editing = false; S.dueOpen = false; render(); window.scrollTo(0,0); }

function flags(o){
  const f = [];
  if(o.delivered_at){ f.push(['done','딜리버리 완료']); return f; }
  if(o.stage === 6) f.push(['ok','딜리버리 대기']);
  if(o.stage === -1) f.push(['info','입고 대기']);
  if(o.stage >= 0 && o.stage < 6 && hoursSince(o.updated_at) > 24) f.push(['warn','미업데이트']);
  if(o.due_date && o.stage < 6 && o.due_date < todayStr()) f.push(['bad','출고 지연']);
  if(o.claim_status === '미접수' && hoursSince(o.created_at) > 24) f.push(['warn','보험 미접수']);
  return f;
}
const needsCheck = o => flags(o).some(([k]) => k === 'warn' || k === 'bad');
const badges = o => flags(o).map(([k,t]) => `<span class="badge b-${k}">${t}</span>`).join(' ');

const ICON_BACK = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';
const ICON_CAM = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
const ICON_OK = '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>';

// ===================== 로그인 =====================
function renderLogin(){
  $top.hidden = true;
  $app.innerHTML = `
  <div class="login">
    <div class="h1" style="color:var(--brand)">카컨 수리관리</div>
    <p class="sub">카컨 본사 · 인증 공업사 전용</p>
    <form id="loginForm" class="card" style="display:flex;flex-direction:column;gap:12px;margin-top:16px">
      <label class="f">이메일<input type="email" name="email" autocomplete="username" required></label>
      <label class="f">비밀번호<input type="password" name="pw" autocomplete="current-password" required></label>
      <div class="err" id="loginErr"></div>
      <button class="btn pri" type="submit">로그인</button>
    </form>
    <p class="sub" style="font-size:13px">계정은 카컨 본사에서 발급합니다. 문의 1555-4655</p>
  </div>`;
}
document.addEventListener('submit', async e => {
  if(e.target.id !== 'loginForm') return;
  e.preventDefault();
  const fd = new FormData(e.target);
  busy(true, '로그인 중…');
  const { error } = await sb.auth.signInWithPassword({ email: fd.get('email').trim(), password: fd.get('pw') });
  busy(false);
  if(error){ document.getElementById('loginErr').textContent = '이메일 또는 비밀번호가 맞지 않습니다'; return; }
  await loadMe(); go('list');
});

async function loadMe(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user){ S.me = null; return; }
  const { data } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  S.me = data || { id: user.id, role: 'pending', name: user.email, active: true };
  S.me.email = user.email;
  if(S.me.role === 'shop'){
    const { data: sh } = await sb.from('shops').select('*').eq('id', S.me.shop_id).maybeSingle();
    S.me.shop = sh;
    if(!sh || !sh.active) S.me.active = false;
  }
  if(isHQ()) await loadShops();
}
async function loadShops(){ const { data } = await sb.from('shops').select('*').order('name'); S.shops = data || []; }

// ===================== 화면 전환 =====================
function renderTop(){
  $top.hidden = false;
  const nav = isHQ() ? `<nav class="nav" aria-label="메뉴">
      <button data-act="nav" data-view="list" class="${S.view==='list'?'on':''}">현황</button>
      <button data-act="nav" data-view="new" class="${S.view==='new'?'on':''}">차량 등록</button>
      ${isAdmin() ? `<button data-act="nav" data-view="admin" class="${S.view==='admin'?'on':''}">관리</button>` : ''}
    </nav>` : '';
  const where = S.me.role === 'shop' && S.me.shop ? S.me.shop.name : (S.me.role === 'admin' ? '대표' : S.me.role === 'staff' ? '본사' : '');
  $top.innerHTML = `<div class="top-in"><span class="brand">카컨 수리관리</span>${nav}
    <span class="who">${esc(where)} · ${esc(S.me.name || S.me.email)}</span>
    <button class="btn sm" data-act="logout">로그아웃</button></div>`;
}
function render(){
  if(!S.me) return renderLogin();
  renderTop();
  if(S.me.role === 'pending' || !S.me.active) return renderPending();
  if(S.view === 'detail') return renderDetail(S.id);
  if(S.view === 'done') return renderDone();
  if(S.view === 'new' && isHQ()) return renderNew();
  if(S.view === 'admin' && isAdmin()) return renderAdmin();
  return isHQ() ? renderBoard() : renderShopList();
}
function renderPending(){
  $app.innerHTML = `<div class="center"><div class="h1">승인 대기 중</div>
    <p class="sub">본사에서 계정 권한을 설정하면 사용할 수 있습니다.<br>설정 후 아래 버튼을 눌러주세요.</p>
    <button class="btn pri" data-act="reload">다시 확인</button></div>`;
}

// ===================== 본사 현황판 =====================
async function renderBoard(quiet){
  if(!quiet) $app.innerHTML = '<div class="empty">불러오는 중…</div>';
  const since = new Date(Date.now() - 30*86400000).toISOString();
  const { data, error } = await sb.from('repair_orders')
    .select('*, shops(name), order_contacts(customer_name)')
    .or(`delivered_at.is.null,delivered_at.gt."${since}"`)
    .order('updated_at', { ascending: false });
  if(error) return fail(error);
  if(S.view !== 'list') return;
  S.orders = data || [];
  const act = S.orders.filter(o => !o.delivered_at);
  const today = todayStr();
  const k = {
    all: act.length,
    check: act.filter(needsCheck).length,
    out: S.orders.filter(o => o.released_at && toLocalInput(o.released_at).slice(0,10) === today).length,
    wait: act.filter(o => o.stage === 6).length,
    done: S.orders.filter(o => o.delivered_at).length
  };
  const kpi = (key, label, cls) => `<button class="kpi ${cls||''} ${S.filter===key?'on':''}" data-act="filter" data-f="${key}"><span>${label}</span><b>${k[key]}</b></button>`;
  $app.innerHTML = `
    <div class="between" style="margin-bottom:12px"><div><div class="sub">카컨 본사</div><div class="h1">수리 진행 현황</div></div>
      <button class="btn sm" data-act="refresh">새로고침</button></div>
    <div class="kpis">${kpi('all','진행 중')}${kpi('check','확인 필요','w')}${kpi('out','오늘 출고','g')}${kpi('wait','딜리버리 대기')}${kpi('done','완료(30일)')}</div>
    <input class="in" id="q" placeholder="차량번호 · 고객명 · 공업사 검색" value="${esc(S.q)}" style="margin-bottom:12px">
    <div id="boardList"></div>`;
  drawBoardList();
}
function drawBoardList(){
  const box = document.getElementById('boardList'); if(!box) return;
  const today = todayStr();
  let list = S.orders;
  if(S.filter === 'all') list = list.filter(o => !o.delivered_at);
  if(S.filter === 'check') list = list.filter(o => !o.delivered_at && needsCheck(o));
  if(S.filter === 'out') list = list.filter(o => o.released_at && toLocalInput(o.released_at).slice(0,10) === today);
  if(S.filter === 'wait') list = list.filter(o => !o.delivered_at && o.stage === 6);
  if(S.filter === 'done') list = list.filter(o => o.delivered_at);
  const q = S.q.trim().replace(/\s/g,'');
  if(q) list = list.filter(o => [o.plate, contactOf(o).customer_name, o.shops && o.shops.name, o.car_model].join(' ').replace(/\s/g,'').includes(q));
  box.innerHTML = list.length ? `<div class="list">${list.map(o => orderCard(o, true)).join('')}</div>` : '<div class="empty">해당하는 차량이 없습니다</div>';
}
function orderCard(o, hq){

  const tail = o.stage === 6
    ? `출고 ${fmtDT(o.released_at)} · 수리 ${repairDays(o)}일`
    : `출고 예정 ${fmtDay(o.due_date)}`;
  return `<button class="oc ${needsCheck(o)?'alert':''}" data-act="open" data-id="${o.id}">
    <div class="between" style="width:100%"><span class="plate">${esc(o.plate)}</span><span>${badges(o)}</span></div>

// ===================== 사진 촬영 → 단계 진행 =====================
async function compress(file){
  const img = await createImageBitmap(file);
  const s = Math.min(1, 1600 / Math.max(img.width, img.height));
  const cv = document.createElement('canvas');
  cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  return await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.82));
}
document.getElementById('cam').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  const o = S.pending;

  try{
    busy(true, '사진 올리는 중…');
    const blob = await compress(file);
    const path = `${o.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
    const up = await sb.storage.from('photos').upload(path, blob, { contentType: 'image/jpeg' });

    const { data: nxt, error } = await sb.rpc('advance_stage', { p_order: o.id, p_photo: path, p_note: null });
    if(error) throw error;
    const { data: fresh } = await sb.from('repair_orders').select('*').eq('id', o.id).maybeSingle();
    busy(false);

function parsePaste(t){
  const get = keys => { for(const k of keys){ const m = t.match(new RegExp(k + '\\s*[:：]\\s*(.*)')); if(m && m[1].trim()) return m[1].trim(); } return ''; };
  const claimRaw = get(['접수번호','사고접수번호']);
  const unclaimed = !claimRaw || /안\s*함|안\s*한|미접수|아직|없음/.test(claimRaw);
  const ins = get(['보험사']);
  const insMatch = INSURERS.find(x => ins && (x.includes(ins) || ins.includes(x.slice(0,2))));
  return {
    customer_name: get(['고객명','성함','이름']),
    phone: normPhone(get(['연락처','전화번호','휴대폰','핸드폰'])),
    car_model: get(['차종']),
    plate: get(['차량번호']),
    pickup_address: get(['주소','픽업주소','픽업 주소']),
    insurer: insMatch || ins,
    claim_no: unclaimed ? '' : claimRaw,
    claim_status: unclaimed ? '미접수' : '접수완료'
  };
}

  if(!d.contact.phone) return '연락처를 입력하세요';
  if(!d.order.shop_id) return '인증 공업사를 선택하세요';
  if(!d.order.consent) return '고객 동의를 확인하고 체크하세요';
  return '';
}

// ===================== 관리 (대표) =====================
async function renderAdmin(){
  $app.innerHTML = '<div class="empty">불러오는 중…</div>';
  await loadShops();
  const { data: users, error } = await sb.from('profiles').select('*').order('created_at');
  if(error) return fail(error);
  if(S.view !== 'admin') return;
  const roleOpt = r => [['pending','승인 대기'],['shop','공업사'],['staff','본사 영업팀'],['admin','대표(관리자)']]
    .map(([v,t]) => `<option value="${v}" ${v === r ? 'selected' : ''}>${t}</option>`).join('');
  const shopOpt = id => `<option value="">-</option>` + S.shops.map(s => `<option value="${s.id}" ${s.id === id ? 'selected' : ''}>${esc(s.name)}${s.active ? '' : ' (비활성)'}</option>`).join('');
  $app.innerHTML = `
  <div class="h1" style="margin-bottom:12px">관리</div>
  <div class="card"><h2>인증 공업사</h2>
    <div class="scroll"><table class="tbl"><thead><tr><th>공업사명</th><th>지역</th><th>상태</th><th></th></tr></thead><tbody>
      ${S.shops.map(s => `<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.region || '')}</td>
        <td><span class="badge ${s.active ? 'b-ok' : 'b-done'}">${s.active ? '활성' : '비활성'}</span></td>
        <td><button class="btn sm" data-act="toggleShop" data-id="${s.id}" data-on="${s.active ? 1 : 0}">${s.active ? '비활성화' : '다시 활성화'}</button></td></tr>`).join('') || '<tr><td colspan="4" class="sub">등록된 공업사가 없습니다</td></tr>'}
    </tbody></table></div>
    <div class="row" style="margin-top:12px">
      <input class="in" id="shopName" placeholder="공업사명 (예: 인천 OO모터스)" style="flex:2;min-width:180px">
      <input class="in" id="shopRegion" placeholder="지역" style="flex:1;min-width:100px">
      <button class="btn pri" data-act="addShop">공업사 추가</button>
    </div>
    <p class="sub" style="font-size:13px">제휴가 끝난 공업사는 삭제하지 말고 비활성화하세요. 수리 이력은 남고 해당 공업사 계정은 즉시 접속이 막힙니다.</p>
  </div>
  <div class="card"><h2>계정 권한</h2>
    <p class="note" style="margin-top:0">새 계정 만들기: Supabase › Authentication › Users › <b>Add user</b> › Create new user (Auto Confirm 체크). 만든 뒤 여기서 역할과 소속 공업사를 지정하세요. 공업사 직원은 이메일이 없으면 <b>shop-지역-이름@carcun.co.kr</b> 같은 형식으로 만들어도 됩니다.</p>
    <div class="scroll"><table class="tbl"><thead><tr><th>이름</th><th>이메일</th><th>역할</th><th>소속 공업사</th><th>사용</th><th></th></tr></thead><tbody>
      ${(users || []).map(u => `<tr data-uid="${u.id}">
        <td><input type="text" class="u-name" value="${esc(u.name || '')}"></td>
        <td style="font-size:13px">${esc(u.email || '')}</td>
        <td><select class="u-role">${roleOpt(u.role)}</select></td>
        <td><select class="u-shop">${shopOpt(u.shop_id)}</select></td>
        <td><input type="checkbox" class="u-active" ${u.active ? 'checked' : ''} aria-label="사용"></td>
        <td><button class="btn sm pri" data-act="saveUser" data-id="${u.id}">저장</button></td></tr>`).join('')}
    </tbody></table></div>
  </div>`;
}

// ===================== 클릭 처리 =====================
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  try{
    switch(act){
      case 'nav': S.filter = S.view === 'list' ? S.filter : 'all'; return go(t.dataset.view);
      case 'open': return go('detail', id);
      case 'back': return go('list');
      case 'refresh': return render();
      case 'reload': await loadMe(); return go('list');
      case 'logout': await sb.auth.signOut(); S.me = null; return renderLogin();
      case 'filter': S.filter = t.dataset.f; document.querySelectorAll('.kpi').forEach(k => k.classList.toggle('on', k.dataset.f === S.filter)); return drawBoardList();
      case 'shoptab': S.showReleased = t.dataset.v === '1'; return renderShopList();
      case 'photo': if(t.dataset.url) window.open(t.dataset.url, '_blank', 'noopener'); return;
      case 'call': sb.rpc('log_contact', { p_order: id, p_action: 'call' }); return; // 기본 동작(전화 걸기) 유지
      case 'advance': S.pending = S.cur; document.getElementById('cam').click(); return;
      case 'toggleDue': S.dueOpen = !S.dueOpen; return renderDetail(S.id);
      case 'saveDue': {
        const d = document.getElementById('dueDate').value;
        const rEl = document.getElementById('dueReason');
        const reason = rEl ? rEl.value : '';
        if(!d) return toast('날짜를 선택하세요');
        if(rEl && !reason) return toast('변경 사유를 선택하세요');
        busy(true);
        const { error } = await sb.rpc('change_due', { p_order: S.cur.id, p_date: d, p_reason: reason });
        busy(false); if(error) throw error;
        S.dueOpen = false; toast('출고 예정일을 저장했습니다'); return renderDetail(S.id);
      }
      case 'deliver': {
        if(!confirm('고객 딜리버리를 완료 처리할까요?')) return;
        busy(true);
        const { error } = await sb.rpc('mark_delivered', { p_order: S.cur.id });
        busy(false); if(error) throw error;
        toast('딜리버리 완료로 기록했습니다'); return renderDetail(S.id);
      }
      case 'addMemo': {
        const body = document.getElementById('memoBody').value.trim();
        if(!body) return toast('메모 내용을 입력하세요');
        busy(true);
        const { error } = await sb.from('memos').insert({ order_id: S.cur.id, body, created_by: S.me.id, author_name: S.me.name || S.me.email });
        busy(false); if(error) throw error;
        return renderDetail(S.id);
      }
      case 'parse': {
        const p = parsePaste(document.getElementById('paste').value || '');
        const f = document.getElementById('orderForm');
        let n = 0;
        Object.entries(p).forEach(([k, v]) => { if(v && f.elements[k]){ f.elements[k].value = v; n++; } });
        return toast(n ? `${n}개 항목을 채웠습니다. 확인 후 저장하세요` : '읽을 수 있는 항목이 없습니다');
      }
      case 'saveNew': {
        const d = readForm(); const msg = validate(d); if(msg) return toast(msg);
        busy(true, '등록 중…');
        const { data: row, error } = await sb.from('repair_orders').insert({ ...d.order, created_by: S.me.id }).select('id').single();
        if(error) throw error;
        const r2 = await sb.from('order_contacts').insert({ order_id: row.id, ...d.contact });
        busy(false); if(r2.error) throw r2.error;
        toast('등록했습니다. 공업사 화면에 바로 표시됩니다'); return go('detail', row.id);
      }
      case 'edit': S.editing = true; return renderDetail(S.id);
      case 'cancelEdit': S.editing = false; return renderDetail(S.id);
      case 'saveEdit': {
        const d = readForm(); const msg = validate(d); if(msg) return toast(msg);
        busy(true, '저장 중…');
        const r1 = await sb.from('repair_orders').update({ ...d.order, updated_at: new Date().toISOString() }).eq('id', S.cur.id);
        if(r1.error) throw r1.error;
        const r2 = await sb.from('order_contacts').upsert({ order_id: S.cur.id, ...d.contact });
        busy(false); if(r2.error) throw r2.error;
        S.editing = false; toast('수정했습니다'); return renderDetail(S.id);
      }
      case 'addShop': {
        const name = document.getElementById('shopName').value.trim();
        const region = document.getElementById('shopRegion').value.trim();
        if(!name) return toast('공업사명을 입력하세요');
        const { error } = await sb.from('shops').insert({ name, region: region || null });
        if(error) throw error;
        toast('공업사를 추가했습니다'); return renderAdmin();
      }
      case 'toggleShop': {
        const on = t.dataset.on === '1';
        if(on && !confirm('이 공업사를 비활성화할까요? 소속 계정은 즉시 접속이 막힙니다.')) return;
        const { error } = await sb.from('shops').update({ active: !on }).eq('id', id);
        if(error) throw error;
        return renderAdmin();
      }
      case 'saveUser': {
        const tr = t.closest('tr');
        const role = tr.querySelector('.u-role').value;
        const shop_id = tr.querySelector('.u-shop').value || null;
        if(role === 'shop' && !shop_id) return toast('공업사 계정은 소속 공업사를 선택해야 합니다');
        if(id === S.me.id && role !== 'admin' && !confirm('본인의 관리자 권한을 해제하면 이 화면에 다시 들어올 수 없습니다. 계속할까요?')) return;
        const { error } = await sb.from('profiles').update({
          name: tr.querySelector('.u-name').value.trim() || null, role,
          shop_id: role === 'shop' ? shop_id : null, active: tr.querySelector('.u-active').checked
        }).eq('id', id);
        if(error) throw error;
        return toast('저장했습니다');
      }
    }
  }catch(err){ fail(err); }
});
document.addEventListener('input', e => { if(e.target.id === 'q'){ S.q = e.target.value; drawBoardList(); } });

// 목록 화면은 1분마다 자동 새로고침
setInterval(() => {
  if(!S.me || S.view !== 'list' || document.visibilityState !== 'visible') return;
  if(document.activeElement && document.activeElement.id === 'q') return;
  isHQ() ? renderBoard(true) : renderShopList(true);
}, 60000);

sb.auth.onAuthStateChange(ev => { if(ev === 'SIGNED_OUT'){ S.me = null; renderLogin(); } });
(async () => { await loadMe(); render(); })();
</script>
