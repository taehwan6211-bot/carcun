<style>
:root{
  --brand:#0B3B8C; --brand-d:#082a63; --ink:#111827; --muted:#4B5563; --line:#E5E7EB; --bg:#F3F4F6; --card:#FFFFFF;
  --warn-bg:#FFEDD5; --warn:#9A3412; --bad-bg:#FEE2E2; --bad:#B91C1C; --ok-bg:#D1FAE5; --ok:#065F46; --info-bg:#DBEAFE; --info:#1E40AF;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
a{color:var(--brand)}
.top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-weight:900;font-size:18px;margin-right:auto;color:var(--brand)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{height:40px;padding:0 12px;border:none;background:transparent;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer}
.nav button.on{background:var(--bg);color:var(--ink)}
.who{font-size:13px;color:var(--muted)}
/* 휴대폰: 상단 메뉴를 좁게(이름 숨김, 버튼 작게) */
@media (max-width:640px){
  .who{display:none}
  .bell-txt{display:none}
  .top-in{gap:4px;padding:8px 12px}
  .brand{font-size:16px}
  .top .btn.sm{height:34px;padding:0 8px;font-size:13px}
  .nav button{height:34px;padding:0 8px;font-size:14px}
}
.todo-sec{margin-bottom:18px}
.todo-sec h3{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:8px}
.todo-sec h3 .cnt{background:var(--bg);border-radius:999px;padding:1px 10px;font-size:14px}
.todo-why{font-size:13px;font-weight:700;color:var(--warn)}
details.more{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
details.more.flat{border:0;padding:0;margin:0;background:none}
details.more.flat > summary{font-size:16px;color:var(--ink);font-weight:800}
details.more > summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:14px;list-style-position:inside}
details.more[open] > summary{margin-bottom:6px}
.ops-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;font-size:14px}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h2{margin:0 0 12px;font-size:16px;font-weight:800}
.h1{font-size:24px;font-weight:900;margin:4px 0}
.sub{font-size:14px;color:var(--muted)}
.btn{height:48px;padding:0 18px;border-radius:12px;border:1px solid #D1D5DB;background:var(--card);font-weight:700;cursor:pointer}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.big{width:100%;height:64px;font-size:18px;font-weight:900;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.orange{background:#C2410C;border-color:#C2410C;color:#fff}
.btn.green{background:#047857;border-color:#047857;color:#fff}
.btn.sm{height:40px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.oc{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;width:100%}
.oc.alert{border-color:#FDBA74;background:#FFFBF5}
.plate{font-size:20px;font-weight:900}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:999px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-warn{background:var(--warn-bg);color:var(--warn)} .b-bad{background:var(--bad-bg);color:var(--bad)}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-info{background:var(--info-bg);color:var(--info)} .b-done{background:var(--bg);color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;text-align:left}
.kpi b{display:block;font-size:30px;font-weight:900}
.kpi span{font-size:13px;font-weight:700;color:var(--muted)}
.kpi.on{outline:2px solid var(--brand)}
.kpi.w b{color:var(--warn)} .kpi.g b{color:var(--ok)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px}
.step span{width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;background:var(--bg);color:#6B7280}
.step small{font-size:12px;color:#6B7280}
.step.done span{background:var(--brand);color:#fff} .step.done small{color:var(--ink);font-weight:700}
.step.next span{background:#fff;color:var(--brand);border:2px solid var(--brand)} .step.next small{color:var(--ink);font-weight:700}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;word-break:break-all}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#CBD5E1;border:none;padding:0;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph em{position:absolute;left:6px;top:6px;font-style:normal;font-size:11px;font-weight:700;background:#fff;padding:2px 6px;border-radius:6px}
.ph small{position:absolute;left:6px;bottom:6px;font-size:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.tl li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--bg);padding-bottom:8px}
.memo{border-bottom:1px solid var(--bg);padding:8px 0;font-size:15px;white-space:pre-wrap}
.memo small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);font-size:12px;text-decoration:underline;cursor:pointer}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
label.f input,label.f select,label.f textarea,.in{height:48px;border:1px solid #D1D5DB;border-radius:10px;padding:0 12px;background:#fff;font-weight:500;width:100%}
label.f textarea,textarea.in{height:auto;min-height:90px;padding:10px 12px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;min-height:44px}
.chk input{width:22px;height:22px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:9}
.bottom .in2{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.back{width:44px;height:44px;border:none;background:transparent;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
.okcircle{width:88px;height:88px;border-radius:999px;background:var(--ok-bg);display:flex;align-items:center;justify-content:center}
.note{font-size:13px;color:#374151;background:var(--bg);padding:12px 14px;border-radius:12px;line-height:1.6}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-size:12px;padding:8px}
.tbl td{padding:8px;border-top:1px solid var(--bg);vertical-align:middle}
.tbl select,.tbl input[type=text]{height:40px;border:1px solid #D1D5DB;border-radius:8px;padding:0 8px;min-width:100px}
.scroll{overflow-x:auto}
#alerts{max-width:1080px;margin:8px auto 0;padding:0 16px;display:flex;flex-direction:column;gap:6px}
#alerts[hidden]{display:none}
.al{display:flex;align-items:stretch;background:var(--info-bg);border:1px solid #BFDBFE;border-radius:12px;overflow:hidden}
.al.loud{background:var(--warn-bg);border-color:#FDBA74}
.al-main{flex:1;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer;font-size:15px;line-height:1.4}
.al-main small{color:var(--muted);margin-left:4px;font-size:13px}
.al-x{background:none;border:0;width:44px;font-size:22px;cursor:pointer;color:var(--muted)}
.btn.bell-on{background:var(--ok-bg);border-color:#6EE7B7;color:var(--ok)}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;font-weight:600;z-index:50;display:none;max-width:90vw}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.75);display:none;align-items:center;justify-content:center;z-index:40;font-weight:800;font-size:17px}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.err{color:var(--bad);font-size:14px;font-weight:600;min-height:20px}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===================== 설정 =====================
const SUPABASE_URL = 'https://vgbrkddsuchmhzevfgkg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Os0roCD0xwSAdCOc2HcNuw_XmFDb4Je';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const STAGES = ['입고','수리 중','출고'];
const LAST = STAGES.length - 1;
const STATUS = ['입고 완료','수리 중','출고 완료'];
const NEXT = ['입고 사진','도장 전 사진','출고 사진'];
const NEXT_GUIDE = ['입고 사진 · 입고할 때 차량 전체', '도장 전 사진 · 판금 끝나고 도장 들어가기 전', '출고 사진 · 수리 끝난 완성차'];
const BTN = ['사진 찍고 입고 완료','도장 전 사진 등록 (판금 끝난 뒤)','완성차 사진 찍고 출고 완료'];
const DONE_TITLE = ['입고 완료','도장 전 사진 등록 완료','출고 완료'];
const DEFAULT_DAYS = 3; // 입고일 + 3일 = 기본 출고 예정일
const DELAY_REASONS = ['부품 대기','보험사 승인 대기','추가 손상 발견','고객 요청','기타'];
const ACCIDENT_TYPES = ['자차','대물','일반수리'];
const NO_INSURANCE = '일반수리'; // 보험을 쓰지 않으므로 '보험 미접수' 경고 제외
const accType = v => v === '피해' ? '대물' : v; // 예전 '피해'는 '대물'과 같은 뜻
const INSURERS = ['삼성화재','현대해상','DB손해보험','KB손해보험','메리츠화재','한화손해보험','롯데손해보험','흥국화재','MG손해보험','AXA손해보험','하나손해보험','캐롯손해보험'];
const SOURCES = ['네이버 플레이스','네이버 블로그','카카오 채널','전화','지인 소개','기타'];
const DOW = '일월화수목금토';
const CANCEL_REASONS = ['고객 취소','전손 처리','다른 곳에서 수리','중복 등록','테스트','기타'];
// 입고 대기: 본사 누구나 / 입고·수리 중: 대표만 / 출고 이후: 불가
const canCancel = o => isHQ() && !o.canceled_at && !o.delivered_at && (o.stage === -1 || (isAdmin() && o.stage >= 0 && o.stage < LAST));

const S = { dirty:false, statDays:14, cancelOpen:false, me:null, view:'list', id:null, filter:'all', q:'', orders:[], shops:[], pending:null, after:null, showReleased:false, editing:false, dueOpen:false };
const $app = document.getElementById('app');
const $top = document.getElementById('top');

// ===================== 공통 도구 =====================
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const isHQ = () => S.me && S.me.active && (S.me.role === 'admin' || S.me.role === 'staff');
const isAdmin = () => S.me && S.me.active && S.me.role === 'admin';
function parseDay(x){ return (typeof x === 'string' && x.length === 10) ? new Date(x + 'T00:00:00') : new Date(x); }
function fmtDay(x){ if(!x) return '-'; const d = parseDay(x); return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`; }
function fmtDT(x){ if(!x) return '-'; const d = new Date(x); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function ago(x){ const m = Math.floor((Date.now() - new Date(x)) / 60000); if(m < 1) return '방금'; if(m < 60) return m + '분 전'; const h = Math.floor(m/60); if(h < 24) return h + '시간 전'; return Math.floor(h/24) + '일 전'; }
function hoursSince(x){ return (Date.now() - new Date(x)) / 3600000; }
function todayStr(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function sod(x){ const d = parseDay(x); d.setHours(0,0,0,0); return d; }
function repairDays(o){ const s = o.intake_at || o.created_at; const e = o.released_at || new Date().toISOString(); return Math.max(0, Math.round((sod(e) - sod(s)) / 86400000)); }
function dueDiffLabel(o){
  if(!o.due_date || !o.released_at) return '';
  const n = Math.round((sod(o.released_at) - sod(o.due_date)) / 86400000);
  return n < 0 ? `예정보다 ${-n}일 빠름` : n === 0 ? '예정대로 출고' : `예정보다 ${n}일 지연`;
}
function toLocalInput(ts){ if(!ts) return ''; const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function normPhone(s){ const d = String(s||'').replace(/\D/g,''); if(d.length === 11) return d.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3'); if(d.length === 10) return d.replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3'); return String(s||'').trim(); }
const nextName = st => st >= LAST ? '' : NEXT[st + 1];
const stageLabel = st => st < 0 ? '입고 대기' : STATUS[st];
const photoLabel = l => l.kind === 'photo' ? '추가' : (l.stage === 1 ? '도장 전' : (STAGES[l.stage] || ''));
const contactOf = o => Array.isArray(o.order_contacts) ? (o.order_contacts[0] || {}) : (o.order_contacts || {});

let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 3200); }
function busy(on, msg){ document.getElementById('busyMsg').textContent = msg || '처리 중…'; document.getElementById('busy').style.display = on ? 'flex' : 'none'; }
function fail(e){ busy(false); console.error(e); toast((e && (e.message || e.error_description)) || '오류가 발생했습니다'); }
// 화면 이동 + 휴대폰 뒤로가기 기록
// opt.replace: 기록을 쌓지 않고 바꿈 / opt.fromHistory: 뒤로가기로 온 것 / opt.edit: 수정 화면
// 저장하지 않은 입력이 있으면 나가기 전에 확인
function leaveOk(){ return !S.dirty || confirm('저장하지 않은 내용이 있습니다.\n이 화면을 나가면 입력한 내용이 사라집니다. 나갈까요?'); }
function go(view, id, opt){
  opt = opt || {};
  if(!opt.fromHistory && !opt.force && !leaveOk()) return false;
  S.dirty = false;
  S.view = view; S.id = id || null; S.editing = !!opt.edit; S.dueOpen = false; S.cancelOpen = false;
  if(!opt.fromHistory){
    const cur = history.state || {};
    const same = cur.view === view && (cur.id || null) === S.id && !!cur.edit === S.editing;
    const st = { view, id: S.id, edit: S.editing };
    try{
      if(opt.replace || same || view === 'done') history.replaceState({ ...st, d: cur.d || 0, root: same ? cur.root : false }, '');
      else history.pushState({ ...st, d: (cur.d || 0) + 1 }, '');
    }catch(e){}
  }
  render(); window.scrollTo(0,0);
}
// 앱 안의 ← 버튼: 이전 화면이 있으면 휴대폰 뒤로가기와 똑같이 동작
// 첫 화면: 본사는 '오늘 할 일'(기능이 켜져 있을 때), 공업사는 작업 목록
const homeView = () => isHQ() ? 'today' : 'list';
function goBack(){ if(history.state && history.state.d > 0) history.back(); else go(homeView(), null, { replace: true }); }
window.addEventListener('popstate', e => {
  if(!S.me) return;
  const st = e.state || { view: 'list' };
  // 사진을 올리는 중에는 화면을 옮기지 않음
  if(document.getElementById('busy').style.display === 'flex'){ try{ history.pushState({ view: S.view, id: S.id, edit: S.editing, d: (st.d || 0) + 1 }, ''); }catch(err){} return; }
  // 저장 안 한 입력이 있는데 '머무르기'를 고르면 화면을 그대로 둠
  if(S.dirty && !leaveOk()){ try{ history.pushState({ view: S.view, id: S.id, edit: S.editing, d: (st.d || 0) + 1 }, ''); }catch(err){} return; }
  if(st.root) toast('뒤로 버튼을 한 번 더 누르면 앱이 닫힙니다');
  go(st.root ? homeView() : (st.view || 'list'), st.id, { fromHistory: true, edit: st.edit });
});
// 시작 화면 아래에 "한 번 더 누르면 종료" 안내용 기록을 하나 깔아 둠
try{ history.replaceState({ view: 'list', d: 0, root: true }, ''); history.pushState({ view: 'list', d: 1 }, ''); }catch(e){}

function flags(o){
  const f = [];
  if(o.canceled_at){ f.push(['done','접수 취소']); return f; }
  if(o.delivered_at){ f.push(['done','딜리버리 완료']); return f; }
  if(o.stage === LAST) f.push(['ok','딜리버리 대기']);
  if(o.stage === -1){
    const late = o.pickup_at ? hoursSince(o.pickup_at) > 24 : hoursSince(o.created_at) > 48;
    f.push(late ? ['warn','입고 사진 없음'] : ['info','입고 대기']);
  }
  if(o.stage === 0 && o.intake_at && hoursSince(o.intake_at) > 24) f.push(['warn','도장 전 사진 없음']);
  if(o.due_date && o.stage < LAST && o.due_date < todayStr()) f.push(['bad','출고 지연']);
  if(o.claim_status === '미접수' && o.accident_type !== NO_INSURANCE && hoursSince(o.created_at) > 24) f.push(['warn','보험 미접수']);
  return f;
}
const needsCheck = o => flags(o).some(([k]) => k === 'warn' || k === 'bad');
const badges = o => flags(o).map(([k,t]) => `<span class="badge b-${k}">${t}</span>`).join(' ');

function drawBoardList(){

// ===================== 공업사별 입력률 (본사) =====================
// 시험 차량(차량번호에 '테' 또는 고객명 '테스트')과 접수 취소 차량은 제외
const isTestOrder = o => /테/.test(o.plate || '') || /테스트/.test(contactOf(o).customer_name || '');
const pct = (a, b) => b ? Math.round(a / b * 100) : null;
const rateCell = (r, target) => r === null ? '<span class="sub">-</span>' : `<b>${r}%</b>${target ? ` <span class="badge ${r >= target ? 'b-ok' : 'b-warn'}">${r >= target ? '기준 달성' : '기준 ' + target + '%'}</span>` : ''}`;
async function renderStats(){
  $app.innerHTML = '<div class="empty">불러오는 중…</div>';
  await loadShops();
  const since = new Date(Date.now() - S.statDays * 86400000).toISOString();
  const { data, error } = await notCanceled(sb.from('repair_orders')
    .select('id, plate, shop_id, stage, pickup_at, created_at, intake_at, released_at, due_date, order_contacts(customer_name)')
    .gte('created_at', since));
  if(error) return fail(error);
  const orders = (data || []).filter(o => !isTestOrder(o));
  // 중간 사진 시각, 예정일 변경 횟수는 진행 기록에서 계산
  const mid = {}, dueChg = {};
  const ids = orders.map(o => o.id);
  for(let i = 0; i < ids.length; i += 100){
    const { data: logs, error: e2 } = await sb.from('stage_logs').select('order_id, kind, stage, created_at').in('order_id', ids.slice(i, i + 100));
    if(e2) return fail(e2);
    (logs || []).forEach(l => {
      if(l.kind === 'stage' && l.stage === 1 && !mid[l.order_id]) mid[l.order_id] = l.created_at;
      if(l.kind === 'due') dueChg[l.order_id] = (dueChg[l.order_id] || 0) + 1;
    });
  }
  if(S.view !== 'stats') return;
  const now = Date.now(), H = 3600000;
  const calc = list => {
    // 입고 사진: 픽업 후 24시간(픽업 시간이 없으면 등록 후 48시간) 안에 등록했는가
    let inDue = 0, inOk = 0, midDue = 0, midOk = 0, rel = 0, relOk = 0, chg = 0, days = 0;
    list.forEach(o => {
      const limit = o.pickup_at ? Date.parse(o.pickup_at) + 24*H : Date.parse(o.created_at) + 48*H;
      if(o.intake_at || now > limit){ inDue++; if(o.intake_at && Date.parse(o.intake_at) <= limit) inOk++; }
      if(o.intake_at){
        const ml = Date.parse(o.intake_at) + 24*H;
        if(mid[o.id] || now > ml){ midDue++; if(mid[o.id] && Date.parse(mid[o.id]) <= ml) midOk++; }
      }
      if(o.released_at){
        rel++; days += repairDays(o);
        if(o.due_date && toLocalInput(o.released_at).slice(0,10) <= o.due_date) relOk++;
      }
      if(dueChg[o.id]) chg++;
    });
    return { n: list.length, inR: pct(inOk, inDue), inDue, midR: pct(midOk, midDue), midDue, relR: pct(relOk, rel), rel, chg, avg: rel ? (days / rel).toFixed(1) : null };
  };
  const shopIds = [...new Set(orders.map(o => o.shop_id).filter(Boolean))];
  const rows = shopIds.map(id => ({ name: shopNameOf(id) || '(공업사 미상)', ...calc(orders.filter(o => o.shop_id === id)) })).sort((a, b) => b.n - a.n);
  const all = calc(orders);
  const tr = (r, bold) => `<tr${bold ? ' style="background:var(--bg)"' : ''}><td>${bold ? '<b>전체</b>' : esc(r.name)}</td><td>${r.n}대</td>
    <td>${rateCell(r.inR, 90)}<div class="sub" style="font-size:12px">${r.inDue}대 중</div></td>
    <td>${rateCell(r.midR, 80)}<div class="sub" style="font-size:12px">${r.midDue}대 중</div></td>
    <td>${rateCell(r.relR, 0)}<div class="sub" style="font-size:12px">출고 ${r.rel}대 중</div></td>
    <td>${r.avg === null ? '<span class="sub">-</span>' : r.avg + '일'}</td><td>${r.chg}대</td></tr>`;
  $app.innerHTML = `
    <div class="between" style="margin-bottom:12px"><div><div class="sub">카컨 본사</div><div class="h1">공업사별 입력률</div></div>
      <button class="btn sm" data-act="refresh">새로고침</button></div>

// 메모: 본사는 '본사 내부'와 '공업사 공유' 두 칸, 공업사는 공유 메모만(DB 권한으로도 제한)
function memoCards(o, memos, hq){
  const ta = (id, ph) => `<textarea class="in memo-in" id="${id}" data-oid="${esc(o.id)}" placeholder="${ph}"></textarea>`;
  const item = m => `<div class="memo">${esc(m.body)}<small>${esc(m.author_name || '')} · ${fmtDT(m.created_at)}${hq
    ? ` · <button class="linkbtn" data-act="memoVis" data-mid="${esc(m.id)}" data-v="${m.visibility === 'shared' ? 'internal' : 'shared'}">${m.visibility === 'shared' ? '내부 메모로 전환' : '공업사에 공유'}</button>` : ''}</small></div>`;
  if(!hq) return `<div class="card"><h2>본사와 공유하는 메모</h2>
    ${ta('memoShared', '예: 부품 입고 지연, 출고 시간 문의')}
    <div style="margin:8px 0 4px"><button class="btn sm pri" data-act="addMemo" data-v="shared">메모 저장</button></div>
    ${memos.map(item).join('') || '<div class="sub">메모가 없습니다</div>'}</div>`;
  const inner = memos.filter(m => m.visibility !== 'shared'), shared = memos.filter(m => m.visibility === 'shared');
  return `<div class="card"><h2>본사 내부 메모 <span class="badge b-done">공업사에 안 보임</span></h2>
    ${ta('memoInternal', '예: 고객 통화, 민원, 비용 협의')}
    <div style="margin:8px 0 4px"><button class="btn sm pri" data-act="addMemo" data-v="internal">내부 메모 저장</button></div>
    ${inner.map(item).join('') || '<div class="sub">메모가 없습니다</div>'}</div>
  <div class="card" style="border:2px solid #FDBA74"><h2>공업사 공유 메모 <span class="badge b-warn">공업사도 봄</span></h2>
    <p class="sub" style="font-size:13px;margin:0 0 8px">공업사에 전달할 내용만 쓰세요. 고객 연락처·개인 사정은 위 내부 메모에.</p>
    ${ta('memoShared', '예: 도장 전 사진 요청, 출고 14시 예정')}
    <div style="margin:8px 0 4px"><button class="btn sm orange" data-act="addMemo" data-v="shared">공업사에 공유</button></div>
    ${shared.map(item).join('') || '<div class="sub">공유한 메모가 없습니다</div>'}</div>`;
}
function stepper(stage){
  return `<div class="steps">${STAGES.map((n,i) =>
    `<div class="step ${i <= stage ? 'done' : i === stage + 1 ? 'next' : ''}"><span>${i <= stage ? '✓' : i + 1}</span><small>${n}</small></div>`).join('')}</div>`;
}

// ===================== 사진 촬영 → 단계 진행 =====================
async function compress(file){
  const img = await createImageBitmap(file);
  const s = Math.min(1, 1600 / Math.max(img.width, img.height));
  const cv = document.createElement('canvas');
  cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  return await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.82));
}
document.getElementById('cam').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  const o = S.pending;
  if(!file || !o) return;
  try{
    busy(true, '사진 올리는 중…');
    const blob = await compress(file);
    const path = `${o.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
    const up = await sb.storage.from('photos').upload(path, blob, { contentType: 'image/jpeg' });
    if(up.error) throw up.error;
    if(S.extra){
      const { error: ex } = await sb.rpc('add_photo', { p_order: o.id, p_photo: path });
      if(ex) throw ex;
      busy(false); toast('사진을 추가했습니다'); S.extra = false; return renderDetail(o.id);
    }
    markMine(o.id, { stage: o.stage + 1 });
    let { data: nxt, error } = await sb.rpc('advance_stage', { p_order: o.id, p_photo: path, p_note: null });
    if(error){
      // 응답만 끊기고 실제로는 저장됐을 수 있으므로 먼저 확인(다시 누르면 단계를 건너뛸 위험)
      const chk = await sb.from('repair_orders').select('stage').eq('id', o.id).maybeSingle();
      if(!chk.error && chk.data && chk.data.stage === o.stage + 1){ nxt = chk.data.stage; error = null; }
      else if(!chk.error && chk.data && chk.data.stage === o.stage){
        ({ data: nxt, error } = await sb.rpc('advance_stage', { p_order: o.id, p_photo: path, p_note: null }));
      }
    }
    if(error){
      markMine(o.id, { stage: o.stage }); busy(false); console.error(error);
      alert('⚠️ 사진은 올라갔지만 단계 저장에 실패했습니다.\n\n인터넷 연결을 확인한 뒤 같은 버튼을 눌러 사진을 한 번 더 올려 주세요.');
      return renderDetail(o.id);
    }
    const { data: fresh } = await sb.from('repair_orders').select('*').eq('id', o.id).maybeSingle();
    busy(false);
    const f = fresh || o;
    S.after = nxt === LAST
      ? { title: `출고 완료 · 수리 ${repairDays(f)}일`, sub: `${f.plate} · 입고 ${fmtDay(f.intake_at || f.created_at)} → 출고 ${fmtDay(f.released_at)}${dueDiffLabel(f) ? ' · ' + dueDiffLabel(f) : ''}`,
          note: '카컨 본사에 출고가 기록됐어요. 고객 딜리버리는 본사에서 진행합니다.', id: o.id }
      : { title: DONE_TITLE[nxt], sub: `${f.plate} · 사진 1장 등록${nxt === 0 && f.due_date ? ' · 출고 예정 ' + fmtDay(f.due_date) : ''}`, note: '카컨 영업팀에 바로 전달됐어요. 고객 안내는 영업팀이 합니다.', id: o.id };
    go('done');
  }catch(err){ fail(err); }
});

// 카톡 붙여넣기 해석: 항목명 띄어쓰기·콜론 유무·다음 줄 값·다양한 표현을 허용하고,
// 항목명이 없어도 전화번호·차량번호·보험사·주소는 생김새로 찾아낸다.
const PASTE_LABELS = {
  customer_name: ['고객명','고객이름','고객성함','고객','성함','성명','이름','차주','차주명','차주성함'],
  phone: ['연락처','고객연락처','연락번호','전화','전화번호','고객전화번호','휴대폰','휴대폰번호','핸드폰','핸드폰번호','휴대전화','hp','h.p'],
  car_model: ['차종','차명','차량명','차량모델','모델','차종명','차량종류'],
  plate: ['차량번호','차번호','차번','번호판','차량넘버','차넘버'],
  car: ['차량','차량정보'],
  pickup_address: ['주소','주소지','픽업주소','픽업장소','픽업위치','픽업지','고객주소','출발지','위치','장소'],
  delivery_address: ['딜리버리주소','딜리버리','배송주소','도착지','탁송지','반납주소','반납장소'],
  insurer: ['보험사','보험회사','보험','담당보험사','보험사명'],
  claim_no: ['접수번호','사고접수번호','보험접수번호','사고번호','접수','보험접수','사고접수','접수여부']
};
const PASTE_RE = Object.entries(PASTE_LABELS).flatMap(([field, labels]) => labels.map(l => ({
  field, len: l.length,
  re: new RegExp('^' + [...l].map(ch => ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('\\s*') + '(?=$|[^\\p{L}])', 'iu')
})));
const PLATE_RE = /(?:(?:서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)\s?)?(?<!\d)\d{2,3}\s?[가-힣]\s?\d{4}(?!\d)/;
const PHONE_RE = /01[016789][\s.\-]?\d{3,4}[\s.\-]?\d{4}(?!\d)/;
const ADDR_RE = /^(서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|충청|전북|전남|전라|경북|경남|경상|제주)|[가-힣]+(시|군|구)\s+[가-힣0-9]+(로|길|동|읍|면|리)(\s|\d|$)/;
const INSURER_ALIAS = [['삼성','삼성화재'],['현대','현대해상'],['DB','DB손해보험'],['디비','DB손해보험'],['동부','DB손해보험'],['KB','KB손해보험'],['케이비','KB손해보험'],['메리츠','메리츠화재'],['한화','한화손해보험'],['롯데','롯데손해보험'],['흥국','흥국화재'],['MG','MG손해보험'],['새마을','MG손해보험'],['AXA','AXA손해보험'],['악사','AXA손해보험'],['하나','하나손해보험'],['캐롯','캐롯손해보험']];
function matchInsurer(s, strict){
  if(!s) return '';
  const full = INSURERS.find(x => s.replace(/\s/g,'').toUpperCase().includes(x.toUpperCase()));
  if(full) return full;
  for(const [a, name] of INSURER_ALIAS){
    const re = new RegExp(a + (strict ? '\\s*(화재|해상|손보|손해|보험|다이렉트)' : ''), 'i');
    if(re.test(s)) return name;
  }
  return '';
}
function parsePaste(t){
  const lines = String(t || '').replace(/\r/g, '').split(/\n|\s[\/|]\s/)
    .map(l => l.replace(/^[^\p{L}\p{N}]+/u, '').replace(/^\d{1,2}[.)]\s*/, '').replace(/^[^\p{L}\p{N}]+/u, '').trim());
  const labelOf = line => { let best = null; for(const x of PASTE_RE){ const m = line.match(x.re); if(m && (!best || m[0].length > best.n)) best = { field: x.field, n: m[0].length }; } return best; };
  const clean = v => v.replace(/^[\s:：=\-–—>)\]】』」.]+/, '').trim();
  const r = {}, used = new Set();
  lines.forEach((line, i) => {
    if(!line || used.has(i)) return;
    const lb = labelOf(line); if(!lb) return;
    used.add(i);
    let v = clean(line.slice(lb.n));
    if(!v){ const j = lines.findIndex((l, k) => k > i && l); if(j > i && !labelOf(lines[j])){ v = lines[j]; used.add(j); } }
    if(v && !r[lb.field]) r[lb.field] = v;
  });
  // '차량 : …' 은 번호판 모양이면 차량번호, 아니면 차종
  if(r.car){ const pm = r.car.match(PLATE_RE); if(pm){ r.plate = r.plate || pm[0]; const rest = r.car.replace(pm[0], '').replace(/[\s,()/]+/g, ' ').trim(); if(rest) r.car_model = r.car_model || rest; } else r.car_model = r.car_model || r.car; }
  // 항목명이 없을 때: 생김새로 찾기
  const free = lines.filter((l, i) => l && !used.has(i)).join('\n');
  const all = lines.join('\n');
  if(!r.phone){ const m = free.match(PHONE_RE) || all.match(PHONE_RE); if(m) r.phone = m[0]; }
  if(!r.plate){ const m = free.match(PLATE_RE); if(m) r.plate = m[0]; }
  if(!r.insurer){ const ins = matchInsurer(free, true); if(ins) r.insurer = ins; }
  if(!r.pickup_address){ const a = lines.find((l, i) => l && !used.has(i) && ADDR_RE.test(l) && !PHONE_RE.test(l)); if(a) r.pickup_address = a; }
  const claimRaw = r.claim_no || '';
  const unclaimed = !claimRaw || /안\s*함|안\s*한|안\s*됨|미접수|아직|없음|예정|^x$|^-$/i.test(claimRaw);
  const ins = r.insurer || '';
  const plate = (r.plate || '').match(PLATE_RE);
  const delivery = (r.delivery_address || '').trim();
  return {
    customer_name: (r.customer_name || '').replace(/\s*(고객)?\s*님$/, '').trim(),
    phone: normPhone(r.phone || ''),
    car_model: r.car_model || '',
    plate: plate ? plate[0].replace(/\s/g, '') : (r.plate || ''),
    pickup_address: r.pickup_address || '',
    delivery_address: delivery && !/동일|같음|상동|위와/.test(delivery) && delivery !== r.pickup_address ? delivery : '',
    insurer: matchInsurer(ins, false) || ins,
    claim_no: unclaimed ? '' : claimRaw,
    claim_status: unclaimed ? '미접수' : '접수완료'
  };
}
function readForm(){
  const f = document.getElementById('orderForm');

}

  return '';
}

const CS_PHONE = '1555-4655';
function customerMsg(o, c){
  const who = c.customer_name ? `${c.customer_name} 고객님` : '고객님';
  const car = [o.car_model, o.plate].filter(Boolean).join(' ');
  const due = o.due_date ? fmtDay(o.due_date) : '';
  const delay = o.delay_reason && due ? `\n${o.delay_reason} 사유로 출고 예정일이 ${due}로 조정되었습니다. 양해 부탁드립니다.` : '';
  let body;
  if(o.delivered_at) body = `${car} 차량 딜리버리가 완료되었습니다.\n수리 부위는 출고일로부터 1년간 무상 A/S가 보장됩니다. 이용해 주셔서 감사합니다.`;
  else if(o.stage === LAST) body = `${car} 차량 수리가 완료되었습니다. (수리기간 ${repairDays(o)}일)\n세차까지 마친 뒤 딜리버리 일정을 안내드리겠습니다.\n수리 부위는 1년 무상 A/S가 보장됩니다.`;
  else if(o.stage === 1) body = `${car} 차량은 판금 작업을 마치고 도장 작업 중입니다.${due && !delay ? `\n출고 예정일은 ${due}입니다.` : ''}${delay}`;
  else if(o.stage === 0) body = `${car} 차량이 공업사에 입고되어 수리를 시작했습니다.${due && !delay ? `\n출고 예정일은 ${due}입니다.` : ''}${delay}\n진행 상황은 단계별로 안내드리겠습니다.`;
  else body = `${car} 차량 사고 수리 접수가 완료되었습니다.${o.pickup_at ? `\n픽업 예정: ${fmtDT(o.pickup_at)}` : ''}\n전문 인력이 무료로 픽업하고, 수리 후 세차까지 마쳐 다시 가져다드립니다.`;
  return `[카컨] ${who}, 카컨입니다.\n${body}\n문의: ${CS_PHONE}`;
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  try{ const ta = document.getElementById('custMsg'); ta.focus(); ta.select(); return document.execCommand('copy'); }catch(e){ return false; }
}

// ===================== 실시간 알림 =====================
// 앱(브라우저)이 열려 있는 동안만 동작한다. 앱을 닫으면 알림이 오지 않는다.
// 공업사: 새 차량 배정·작업 중단 / 본사: 출고 완료·예정일 변경·새 경고
const LIVE = { ch: null, known: null, ctx: null, warnReady: false };
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} };
const bellOn = () => lsGet('carcun_bell') === '1';
const LIVE_COLS = 'id, plate, car_model, stage, shop_id, delivered_at, due_date, delay_reason';

function audioCtx(){
  try{
    LIVE.ctx = LIVE.ctx || new (window.AudioContext || window.webkitAudioContext)();
    if(LIVE.ctx.state === 'suspended') LIVE.ctx.resume();
  }catch(e){}
  return LIVE.ctx;
}
function beep(){
  if(!bellOn()) return;
  const ctx = audioCtx();
  if(ctx) try{
    [880, 1175, 880].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), t0 = ctx.currentTime + i * 0.18;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
      o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0 + 0.17);
    });
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([200, 100, 200]); }catch(e){}
}
// loud: 소리·진동 + (다른 탭을 보고 있으면) PC 알림창, quiet: 알림판에만 표시
function notify(title, body, orderId, loud){
  S.alerts = [{ title, body, id: orderId || '', at: new Date(), loud }, ...(S.alerts || [])].slice(0, 5);
  drawAlerts();
  if(!loud) return;
  beep(); toast(`${title} · ${body}`);
  if(bellOn() && 'Notification' in window && Notification.permission === 'granted' && document.visibilityState !== 'visible'){
    try{
      const n = new Notification('카컨 · ' + title, { body, tag: 'carcun-' + (orderId || title) });
      n.onclick = () => { window.focus(); if(orderId) go('detail', orderId); n.close(); };
    }catch(e){}
  }
}
function drawAlerts(){
  const box = document.getElementById('alerts'); if(!box) return;
  const list = S.me ? (S.alerts || []) : [];
  box.hidden = !list.length;
  box.innerHTML = list.map((a, i) => `<div class="al ${a.loud ? 'loud' : ''}">
    <button class="al-main" data-act="alertOpen" data-i="${i}" ${a.id ? `data-id="${esc(a.id)}"` : ''}><b>${esc(a.title)}</b> · ${esc(a.body)}<small>${pad(a.at.getHours())}:${pad(a.at.getMinutes())}</small></button>
    <button class="al-x" data-act="alertClose" data-i="${i}" aria-label="알림 닫기">×</button></div>`).join('');
}
async function toggleBell(){
  if(bellOn()){ lsSet('carcun_bell', '0'); renderTop(); return toast('알림음을 껐습니다. 알림판 표시는 계속됩니다'); }
  lsSet('carcun_bell', '1'); audioCtx(); renderTop();
  if('Notification' in window && Notification.permission === 'default'){ try{ await Notification.requestPermission(); }catch(e){} }
  beep(); toast('알림음을 켰습니다. 방금 소리가 들렸다면 정상입니다');
}

function markMine(id, patch){ const k = LIVE.known && LIVE.known.get(id); if(k) Object.assign(k, patch); }
function shopNameOf(id){ return (S.shops.find(s => s.id === id) || {}).name || ''; }
// 차량 한 대의 새 상태를 이전 상태와 비교해 알림을 판단
function handleRow(n){
  if(!n || !n.id || !LIVE.known) return;
  const prev = LIVE.known.get(n.id);
  if(n.delivered_at || n.canceled_at){
    if(n.canceled_at && prev && S.me.role === 'shop'){
      if(prev.stage >= 0) notify('작업 중단', `${n.plate} · 본사에서 접수를 취소했습니다. 작업을 멈춰 주세요`, n.id, true);
      else notify('접수 취소', `${n.plate} · 본사에서 접수를 취소했습니다`, null, false);
    }
    LIVE.known.delete(n.id); return;
  }
  LIVE.known.set(n.id, { stage: n.stage, shop_id: n.shop_id, due_date: n.due_date || null });
  if(S.me.role === 'shop'){
    if(n.shop_id === S.me.shop_id && (!prev || prev.shop_id !== n.shop_id) && n.stage < LAST)
      notify('새 차량 배정', `${n.plate}${n.car_model ? ' · ' + n.car_model : ''}`, n.id, true);
  } else if(prev && n.stage > prev.stage && n.stage >= 0){
    const sh = shopNameOf(n.shop_id);
    if(n.stage === LAST) notify('출고 완료', `${n.plate}${sh ? ' · ' + sh : ''} · 딜리버리 안내 필요`, n.id, true);
  } else if(prev && prev.due_date && n.due_date && prev.due_date !== n.due_date && n.stage < LAST){
    const sh = shopNameOf(n.shop_id);
    notify('출고 예정일 변경', `${n.plate}${sh ? ' · ' + sh : ''} · ${fmtDay(prev.due_date)} → ${fmtDay(n.due_date)}${n.delay_reason ? ' · ' + n.delay_reason : ''} · 고객 안내 필요`, n.id, true);
  }
}
async function startLive(){
  stopLive();
  if(!S.me || !S.me.active || S.me.role === 'pending') return;
  const me = S.me;
  const { data } = await notCanceled(sb.from('repair_orders').select(LIVE_COLS).is('delivered_at', null));
  if(S.me !== me) return;
  LIVE.known = new Map((data || []).map(o => [o.id, { stage: o.stage, shop_id: o.shop_id, due_date: o.due_date || null }]));
  LIVE.ch = sb.channel('orders-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'repair_orders' }, p => { handleRow(p.new); liveRefresh(p.new && p.new.id); })
    .subscribe();
}
function stopLive(){
  if(LIVE.ch){ try{ sb.removeChannel(LIVE.ch); }catch(e){} LIVE.ch = null; }
  LIVE.known = null; LIVE.warnReady = false; S.alerts = []; drawAlerts();
}
// 실시간 연결이 끊겼거나 꺼져 있어도 놓친 변경을 잡아내는 예비 확인
async function resyncLive(){
  if(!LIVE.known || !S.me) return;
  const { data } = await notCanceled(sb.from('repair_orders').select(LIVE_COLS).is('delivered_at', null));
  if(!data || !LIVE.known) return;
  const ids = new Set(data.map(o => o.id));
  let changed = false;
  data.forEach(o => { const p = LIVE.known.get(o.id); if(!p || p.stage !== o.stage || p.shop_id !== o.shop_id || (p.due_date || null) !== (o.due_date || null)){ handleRow(o); changed = true; } });
  // 목록에서 사라진 차량: 취소된 것인지 확인해서 '작업 중단' 알림을 놓치지 않게 함
  const gone = [...LIVE.known.keys()].filter(id => !ids.has(id));
  if(gone.length){
    changed = true;
    const { data: rows, error: goneErr } = await sb.from('repair_orders').select(LIVE_COLS + ', canceled_at').in('id', gone);
    // 조회에 실패하면 기억 목록을 그대로 두고 다음 확인 때 다시 시도
    if(!goneErr){
      (rows || []).forEach(o => handleRow(o));
      gone.forEach(id => { if(LIVE.known) LIVE.known.delete(id); });
    }
  }
  if(changed) liveRefresh(null);
}
// 1분마다 내 권한이 바뀌었는지 확인(대표가 역할·소속·사용 여부를 바꾼 경우)
async function checkMyRole(){
  if(!S.me || S.me.role === 'pending') return;
  const { data, error } = await sb.from('profiles').select('role, shop_id, active').eq('id', S.me.id).maybeSingle();
  if(error) return;
  let shopOn = true;
  if(data && data.role === 'shop' && data.shop_id){
    const r = await sb.from('shops').select('active').eq('id', data.shop_id).maybeSingle();
    if(r.error) return;
    shopOn = !!(r.data && r.data.active);
  }
  const now = data ? `${data.role}|${data.shop_id || ''}|${!!data.active && shopOn}` : 'pending||true';
  const before = `${S.me.role}|${S.me.shop_id || ''}|${!!S.me.active}`;
  if(now === before) return;
  await loadMe(); if(!S.me) return;
  toast('계정 권한이 변경되었습니다'); startLive(); go(homeView(), null, { replace: true, force: true });
}
// 보고 있는 화면을 조용히 새로고침(입력 중이면 건드리지 않음)
let liveT;
function liveRefresh(id){
  clearTimeout(liveT);
  liveT = setTimeout(() => {
    if(!S.me || document.visibilityState !== 'visible' || S.dirty) return;
    if(document.getElementById('busy').style.display === 'flex') return;
    const a = document.activeElement;
    const typing = a && (a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || (a.tagName === 'INPUT' && a.type !== 'checkbox'));
    if(S.view === 'list' && !(a && a.id === 'q')) return isHQ() ? renderBoard(true) : renderShopList(true);
    if(S.view === 'today' && isHQ()) return renderToday(true);
    if(S.view === 'detail' && id && S.id === id && !S.editing && !S.dueOpen && !typing) return renderDetail(id);
  }, 800);
}
// 본사: 새로 생긴 경고만 알림(이미 본 경고는 다시 울리지 않음)
function checkWarnings(orders){
  if(!isHQ()) return;
  const key = 'carcun_warn_seen_' + S.me.id;
  const now = [];
  orders.filter(isLive).forEach(o => flags(o).forEach(([k, t]) => { if(k === 'warn' || k === 'bad') now.push(o.id + '|' + t); }));
  const stored = lsGet(key);
  let seen; try{ seen = new Set(JSON.parse(stored || '[]')); }catch(e){ seen = new Set(); }
  const fresh = now.filter(k => !seen.has(k));
  lsSet(key, JSON.stringify(now));
  const first = stored === null && !LIVE.warnReady;
  LIVE.warnReady = true;
  if(first || !fresh.length) return;
  fresh.slice(0, 3).forEach(k => {
    const [id, t] = k.split('|'); const o = orders.find(x => x.id === id) || {};
    const sh = (o.shops && o.shops.name) || shopNameOf(o.shop_id);
    notify('확인 필요 · ' + t, `${o.plate || ''}${sh ? ' · ' + sh : ''}`, id, true);
  });
  if(fresh.length > 3) notify('확인 필요', `그 외 ${fresh.length - 3}건 · 현황판의 '확인 필요'를 눌러 보세요`, null, false);
}
async function pollWarnings(){
  const { data } = await notCanceled(sb.from('repair_orders').select('*, shops(name)').is('delivered_at', null));
  if(data) checkWarnings(data);
}

// ===================== 클릭 처리 =====================
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  try{
    switch(act){
      case 'nav': S.filter = S.view === 'list' ? S.filter : 'all'; return go(t.dataset.view, null, { replace: S.view === 'done' });
      case 'open': return go('detail', id);
      case 'back': return goBack();
      case 'refresh': if(!leaveOk()) return; S.dirty = false; return render();
      case 'reload': await loadMe(); startLive(); return go(homeView());
      case 'logout': if(!leaveOk()) return; S.dirty = false; stopLive(); await sb.auth.signOut(); S.me = null; return renderLogin();
      case 'bell': return toggleBell();
      case 'todayMine': lsSet(todayMineKey(), t.dataset.v); return renderToday();
      case 'notifyDone': {
        busy(true);
        const { error } = await sb.from('repair_orders').update({ customer_notified_at: new Date().toISOString(), customer_notified_by: S.me.id }).eq('id', S.cur.id);
        busy(false); if(error) throw error;
        toast('고객 안내 완료로 기록했습니다'); return renderDetail(S.id);
      }
      case 'statDays': S.statDays = +t.dataset.v; return renderStats();
      case 'toggleCancel': S.cancelOpen = !S.cancelOpen; return renderDetail(S.id);
      case 'doCancel': {
        const r = document.getElementById('cancelReason').value;
        const note = document.getElementById('cancelNote').value.trim();
        if(!r) return toast('취소 사유를 선택하세요');
        if(r === '기타' && !note) return toast('기타 사유는 상세 내용을 적어주세요');
        const reason = note ? `${r} · ${note}` : r;
        if(!confirm(`${S.cur.plate} 접수를 취소할까요?\n사유: ${reason}${S.cur.stage >= 0 ? '\n\n⚠️ 공업사에서 작업 중인 차량입니다. 공업사에 작업 중단 알림이 갑니다.' : ''}`)) return;
        busy(true);
        const { error } = await sb.from('repair_orders').update({ canceled_at: new Date().toISOString(), cancel_reason: reason, canceled_by: S.me.id, updated_at: new Date().toISOString() }).eq('id', S.cur.id);
        if(error){ busy(false); throw error; }
        await sb.from('memos').insert({ order_id: S.cur.id, body: `[접수 취소] ${reason}`, created_by: S.me.id, author_name: S.me.name || S.me.email });
        busy(false); S.cancelOpen = false; toast('접수를 취소했습니다. 기록은 남아 있습니다'); return renderDetail(S.id);
      }
      case 'undoCancel': {
        if(!confirm(`${S.cur.plate} 접수 취소를 되돌릴까요?`)) return;
        busy(true);
        const { error } = await sb.from('repair_orders').update({ canceled_at: null, cancel_reason: null, canceled_by: null, updated_at: new Date().toISOString() }).eq('id', S.cur.id);
        if(error){ busy(false); throw error; }
        await sb.from('memos').insert({ order_id: S.cur.id, body: '[접수 취소 되돌림]', created_by: S.me.id, author_name: S.me.name || S.me.email });
        busy(false); toast('되돌렸습니다. 다시 진행 중으로 표시됩니다'); return renderDetail(S.id);
      }
      case 'copyMsg': { const ok = await copyText(document.getElementById('custMsg').value); return toast(ok ? '복사했습니다. 카톡·문자에 붙여넣으세요' : '복사가 안 됩니다. 문구를 길게 눌러 직접 복사하세요'); }
      case 'alertOpen': { const i = +t.dataset.i; S.alerts.splice(i, 1); drawAlerts(); if(id) return go('detail', id); S.filter = 'check'; return go('list'); }
      case 'alertClose': S.alerts.splice(+t.dataset.i, 1); return drawAlerts();
      case 'filter': S.filter = t.dataset.f; document.querySelectorAll('.kpi').forEach(k => k.classList.toggle('on', k.dataset.f === S.filter)); return drawBoardList();
      case 'shoptab': S.showReleased = t.dataset.v === '1'; return renderShopList();
      case 'photo': if(t.dataset.url) window.open(t.dataset.url, '_blank', 'noopener'); return;
      case 'call': sb.rpc('log_contact', { p_order: id, p_action: 'call' }); return; // 기본 동작(전화 걸기) 유지
      case 'advance': S.extra = false; S.pending = S.cur; document.getElementById('cam').click(); return;
      case 'extraPhoto': S.extra = true; S.pending = S.cur; document.getElementById('cam').click(); return;
      case 'toggleDue': S.dueOpen = !S.dueOpen; return renderDetail(S.id);
      case 'saveDue': {
        const d = document.getElementById('dueDate').value;
        const rEl = document.getElementById('dueReason');
        const reason = rEl ? rEl.value : '';
        if(!d) return toast('날짜를 선택하세요');
        if(rEl && !reason) return toast('변경 사유를 선택하세요');
        busy(true); markMine(S.cur.id, { due_date: d });
        const { error } = await sb.rpc('change_due', { p_order: S.cur.id, p_date: d, p_reason: reason });

      }

        const { error } = await sb.rpc('mark_delivered', { p_order: S.cur.id });
        busy(false); if(error) throw error;
        toast('딜리버리 완료로 기록했습니다'); return renderDetail(S.id);
      }
      case 'addMemo': {
        const vis = t.dataset.v || '';
        const el = document.getElementById(vis === 'shared' ? 'memoShared' : 'memoInternal');

        if(!body) return toast('메모 내용을 입력하세요');

        if(vis === 'shared' && isHQ() && PHONE_RE.test(body) && !confirm('공유 메모에 전화번호가 있습니다.\n공업사에 그대로 보입니다. 저장할까요?\n(고객 연락처는 내부 메모에 쓰는 것을 권합니다)')) return;
        busy(true);
        const row = { order_id: S.cur.id, body, created_by: S.me.id, author_name: S.me.name || S.me.email };
        row.visibility = vis === 'shared' ? 'shared' : 'internal';
        const { error } = await sb.from('memos').insert(row);
        busy(false); if(error) throw error;
        el.value = ''; S.dirty = false;
        toast(vis === 'shared' && isHQ() ? '공업사와 공유했습니다' : '메모를 저장했습니다');
        return renderDetail(S.id);
      }
      case 'memoVis': {
        const v = t.dataset.v;
        if(v === 'shared' && !confirm('이 메모를 공업사에 공개할까요?\n고객 연락처나 개인 사정이 없는지 확인해 주세요.')) return;
        busy(true);
        const { error } = await sb.rpc('set_memo_visibility', { p_memo: t.dataset.mid, p_visibility: v });
        busy(false); if(error) throw error;
        toast(v === 'shared' ? '공업사에 공유했습니다' : '본사 내부 메모로 바꿨습니다');
        return renderDetail(S.id);
      }
      case 'parse': {
        S.dirty = true;
        const p = parsePaste(document.getElementById('paste').value || '');
        const f = document.getElementById('orderForm');
        let n = 0;
        Object.entries(p).forEach(([k, v]) => { if(v && f.elements[k]){ f.elements[k].value = v; n++; } });
        if(p.delivery_address) f.elements.same.checked = false;
        return toast(n ? `${n}개 항목을 채웠습니다. 확인 후 저장하세요` : '읽을 수 있는 항목이 없습니다');
      }
      case 'saveNew': {
        const d = readForm(); const msg = validate(d); if(msg) return toast(msg);
        busy(true, '등록 중…');
        // 차량과 연락처를 DB 함수 하나로 한 번에 저장(반쪽 저장 없음)
        const { data: newId, error } = await sb.rpc('create_order', { p_order: d.order, p_contact: d.contact });
        busy(false); if(error) throw error;
        S.dirty = false; toast('등록했습니다. 공업사 화면에 바로 표시됩니다'); return go('detail', newId, { replace: true });
      }
      case 'edit': return go('detail', S.id, { edit: true });
      case 'cancelEdit': return (history.state && history.state.edit && history.state.d > 0) ? history.back() : go('detail', S.id, { replace: true });
      case 'saveEdit': {
        const d = readForm(); const msg = validate(d); if(msg) return toast(msg);
        // 출고 예정일은 여기서 바꾸지 않음([출고 예정일 변경]에서 사유와 함께 기록)
        const { due_date, ...orderPatch } = d.order;
        busy(true, '저장 중…'); markMine(S.cur.id, { shop_id: d.order.shop_id });
        const r1 = await sb.from('repair_orders').update({ ...orderPatch, updated_at: new Date().toISOString() }).eq('id', S.cur.id);
        if(r1.error) throw r1.error;
        const r2 = await sb.from('order_contacts').upsert({ order_id: S.cur.id, ...d.contact });
        busy(false); if(r2.error) throw r2.error;
        toast('수정했습니다'); S.dirty = false;
        return (history.state && history.state.edit && history.state.d > 0) ? history.back() : go('detail', S.id, { replace: true });
      }
      case 'addShop': {
        const name = document.getElementById('shopName').value.trim();
        const region = document.getElementById('shopRegion').value.trim();
        if(!name) return toast('공업사명을 입력하세요');
        const { error } = await sb.from('shops').insert({ name, region: region || null });
        if(error) throw error;
        toast('공업사를 추가했습니다'); return renderAdmin();
      }
      case 'toggleShop': {
        const on = t.dataset.on === '1';
        if(on && !confirm('이 공업사를 비활성화할까요? 소속 계정은 즉시 접속이 막힙니다.')) return;
        const { error } = await sb.from('shops').update({ active: !on }).eq('id', id);
        if(error) throw error;
        return renderAdmin();
      }
      case 'saveUser': {
        const tr = t.closest('tr');
        const role = tr.querySelector('.u-role').value;
        const shop_id = tr.querySelector('.u-shop').value || null;
        if(role === 'shop' && !shop_id) return toast('공업사 계정은 소속 공업사를 선택해야 합니다');
        if(id === S.me.id && role !== 'admin' && !confirm('본인의 관리자 권한을 해제하면 이 화면에 다시 들어올 수 없습니다. 계속할까요?')) return;
        const { error } = await sb.from('profiles').update({
          name: tr.querySelector('.u-name').value.trim() || null, role,
          shop_id: role === 'shop' ? shop_id : null, active: tr.querySelector('.u-active').checked
        }).eq('id', id);
        if(error) throw error;
        // 내 계정 권한을 바꿨으면 화면에 바로 반영
        if(id === S.me.id){ await loadMe(); toast('내 권한이 변경되었습니다'); startLive(); return go(homeView(), null, { replace: true, force: true }); }
        return toast('저장했습니다');
      }
    }
  }catch(err){ fail(err); }
});
document.addEventListener('input', e => { if(e.target.id === 'q'){ S.q = e.target.value; drawBoardList(); } });
// 입력 중인 내용이 있는지 표시(메모, 차량 등록·수정, 붙여넣기, 취소 사유, 예정일 변경)
const DRAFT_IDS = ['memoInternal', 'memoShared', 'paste', 'cancelNote', 'cancelReason', 'dueDate', 'dueReason'];
const markDirty = e => { if(e.target.closest && (e.target.closest('#orderForm') || DRAFT_IDS.includes(e.target.id))) S.dirty = true; };
document.addEventListener('input', markDirty);
// 영업 담당자 변경(선택하면 바로 저장, 수정 이력은 DB가 자동 기록)
document.addEventListener('change', async e => {
  if(e.target.id !== 'assigneeSel' || !S.cur) return;
  try{
    busy(true);
    const { error } = await sb.from('repair_orders').update({ assignee_id: e.target.value || null }).eq('id', S.cur.id);
    busy(false); if(error) throw error;
    toast(e.target.value ? `담당자를 ${staffName(e.target.value)}(으)로 바꿨습니다` : '담당자를 비웠습니다');
  }catch(err){ fail(err); renderDetail(S.id); }
});
document.addEventListener('change', markDirty);
// 새로고침·창 닫기 때도 확인
window.addEventListener('beforeunload', e => { if(S.dirty){ e.preventDefault(); e.returnValue = ''; } });

// 화면으로 돌아오면(휴대폰 잠금 해제 등) 놓친 변경을 바로 확인
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && S.me){ resyncLive(); liveRefresh(null); } });
// 첫 터치 때 알림음 준비(브라우저는 사용자가 한 번 눌러야 소리를 허용함)
document.addEventListener('pointerdown', () => { if(bellOn()) audioCtx(); }, { once: true });

// 승인 대기 화면: 20초마다 권한이 지정됐는지 자동 확인
setInterval(async () => {
  if(!S.me || document.visibilityState !== 'visible' || !(S.me.role === 'pending' || !S.me.active)) return;
  await loadMe();
  if(S.me && S.me.role !== 'pending' && S.me.active){ toast('권한이 지정되었습니다'); startLive(); go(homeView()); }
}, 20000);

// 목록 화면은 1분마다 자동 새로고침
// + 1분마다 변경 확인(실시간 연결이 끊겨도 늦어도 1분 안에 알림)
setInterval(() => {
  if(!S.me || document.visibilityState !== 'visible') return;
  resyncLive(); checkMyRole();
  if(S.view === 'today' && isHQ()){ pollWarnings(); if(!S.dirty) renderToday(true); return; }
  if(S.view !== 'list'){ if(isHQ()) pollWarnings(); return; }
  if(document.activeElement && document.activeElement.id === 'q') return;
  isHQ() ? renderBoard(true) : renderShopList(true);
}, 60000);

sb.auth.onAuthStateChange(ev => { if(ev === 'SIGNED_OUT'){ stopLive(); S.me = null; renderLogin(); } });
(async () => {
  await loadMe();
  if(S.me){ S.view = homeView(); try{ history.replaceState({ view: S.view, d: 1 }, ''); }catch(e){} }
  render(); startLive();
})();
</script>
</body>
</html>
